services:
  app:
    build: .
    container_name: laravel_inventory_smkn10
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - laravel_network
      - caddy_net       # ✅ Benar, di bawah service

  postgres:
    image: postgres:15
    container_name: inventory_smkn10_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: haidar
      POSTGRES_PASSWORD: 'inventory10&24'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel_network
      
networks:
  laravel_network: {}
  caddy_net:
    external: true

volumes:
  postgres_data: {}
