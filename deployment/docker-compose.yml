services:
  app:
    build: .
    container_name: laravel_inventory_smkn10
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - laravel_network

  postgres:
    image: postgres:15
    container_name: inventory_smkn10_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: haidar
      POSTGRES_PASSWORD: 'asubabiceleng'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel_network

  nginx:
    image: nginx:latest
    container_name: laravel_inventory_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
    depends_on:
      - app
    networks:
      - laravel_network 

networks:
  laravel_network:
  
volumes:
  postgres_data: